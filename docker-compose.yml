version: '3'
services:
  web:
    image: php:apache
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
    depends_on:
      - db
  db:
    image: mariadb
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: medconsultas
      MYSQL_USER: user
      MYSQL_PASSWORD: user_password
    volumes:
      - todo-data:/var/lib/mysql
volumes:
  todo-data: